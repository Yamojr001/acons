name: Deploy EduSaaS to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: edusaas_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, bcmath, mysql, redis, gd, zip

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare test environment
        run: |
          cp .env.example .env.testing
          sed -i 's/DB_DATABASE=edusaas/DB_DATABASE=edusaas_test/' .env.testing
          sed -i 's/DB_PASSWORD=CHANGE_THIS_STRONG_PASSWORD/DB_PASSWORD=root/' .env.testing
          php artisan key:generate --env=testing

      - name: Run PHP tests
        run: php artisan test --env=testing --parallel

  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/edusaas

            echo "📦 Pulling latest code..."
            git pull origin main

            echo "🔧 Installing PHP dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "📦 Installing JS dependencies..."
            npm ci --production=false

            echo "🏗️ Building frontend..."
            npm run build

            echo "🗄️ Running migrations..."
            php artisan migrate --force

            echo "⚡ Optimizing..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            php artisan optimize

            echo "♻️ Restarting services..."
            sudo systemctl reload php8.3-fpm
            sudo supervisorctl restart edusaas-horizon

            echo "✅ Deployment complete!"

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [test, deploy]
    if: failure()
    steps:
      - name: Notify team
        run: echo "Deployment failed! Check logs."
